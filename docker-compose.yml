version: "3.9"

services:
  qdrant:
    image: qdrant/qdrant:v1.11.3
    container_name: aletheia-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aletheia-backend
    ports:
      - "8000:8000"
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
    depends_on:
      - qdrant
    volumes:
      - ./backend:/app
    restart: unless-stopped

volumes:
  qdrant_data:
